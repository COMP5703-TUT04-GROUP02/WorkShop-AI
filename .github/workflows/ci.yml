name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workshop
          POSTGRES_PASSWORD: workshop
          POSTGRES_DB: workshop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workshop -d workshop_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      WORKSHOP_DATABASE_URL: postgresql+psycopg://workshop:workshop@localhost:5432/workshop_test
      WORKSHOP_REDIS_HOST: 127.0.0.1
      WORKSHOP_REDIS_PORT: 6379
      WORKSHOP_CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      WORKSHOP_CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      QWEN_API_KEY: ""
      DASHSCOPE_API_KEY: ""
      OPENAI_API_KEY: ""
      LLM_API_KEY: ""
      EMBEDDING_API_KEY: ""
      LLM_TIMEOUT_SECONDS: "5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Generate JWT keys
        run: python scripts/generate_jwt_keys.py
      - name: Migrate
        run: alembic upgrade head
      - name: Lint
        run: ruff check backend tests
      - name: Test
        run: pytest -q --durations=20

  mobile:
    name: mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/mobile/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
